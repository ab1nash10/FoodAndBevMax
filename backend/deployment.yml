# NOT THE DEPLOYED PATH. AAHAR is deployed by the Helm chart in infra/helm/fandb, as the
# release `fandb` in namespace `dev`. That is what the Jenkins pipeline runs and what the
# cluster runs. This file is the raw-manifest alternative, kept for reference only.
#
# Do not apply it alongside the chart: both create an ingress in the ALB group
# `dev-external`, and the controller rejects the conflict. This file also deploys into
# namespace `aahar`, so applying it gives you a second, half-configured copy of everything.
#
# Backend workloads:
#   kubectl apply -f backend/deployment.yml
#
# Depends on the shared resources in infra/k8s (namespace, config and secret) and on the
# migration Job having completed - all three services share one Prisma schema, so they must
# not start against an un-migrated database.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: aahar
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: aahar
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: aahar
    spec:
      # The services call enableShutdownHooks(), so SIGTERM drains in-flight requests.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: auth-service
      containers:
        - name: auth-service
          # Replace :latest with the commit SHA the pipeline built.
          image: 013929206983.dkr.ecr.ap-south-1.amazonaws.com/max-ai-repo:auth-service-latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4001
          env:
            - name: PORT
              value: '4001'
          envFrom:
            - configMapRef:
                name: aahar-config
            - secretRef:
                name: aahar-secrets
          # Liveness is a socket check on purpose. The health endpoint also probes Postgres
          # and Redis, so using it here would restart every pod during a brief database blip
          # instead of just removing them from the load balancer.
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /fandb/api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: aahar
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: aahar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: auth-service
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-service
  namespace: aahar
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service
  namespace: aahar
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
