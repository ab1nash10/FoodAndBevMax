<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"active":{"editor":"enum","options":["dashboard","transfers","grns","ledgers","items","production"],"default":"dashboard"},"collapsed":{"editor":"boolean","default":false},"fly":{"editor":"enum","options":["","dash","org","menu","map","inv","kit","acc"],"default":""},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const owner = { items: 'menu', grns: 'inv', transfers: 'inv', ledgers: 'inv', production: 'kit' }[props.active] || 'inv';
    this.state = { open: { [owner]: true }, collapsed: !!props.collapsed, fly: props.fly || '' };
  }
  pal(t) {

      : { surface: '#FFFFFF', subtle: '#F8FAFC', border: '#E3E8EF', divider: '#EEF1F5', text: '#0F172A', text2: '#334155', text3: '#475569', muted: '#5B6577', link: '#0B57A4', primarySoft: '#E8F0FA', pendBg: '#FEF3C7', pendFg: '#92400E', logoChip: '#FFFFFF', kbd: '#FFFFFF', flyShadow: '0 16px 40px rgba(15, 23, 42, 0.16)' };

      ['org', 'Organization', 'SETUP', [['Locations'], ['Stores'], ['Kitchens'], ['Restaurants'], ['Employees'], ['POS & Payment Machines']]],
      ['menu', 'Item & Menu Setup', '', [['Item Categories'], ['Items', 'items', 'Items'], ['Item Prices'], ['Time Slots'], ['Restaurant Menus']]],
      ['map', 'Item Mapping', '', [['Store Items'], ['Kitchen Items']]],
      ['inv', 'Inventory', 'OPERATIONS', [['GRNs', 'grns', 'Grn', 3], ['Store Stock'], ['Stock Ledgers', 'ledgers'], ['Transfers', 'transfers', 'Transfers', 8], ['Restaurant Stock']]],
      ['kit', 'Kitchen Operations', '', [['Kitchen Production', 'production', 'Production', 2], ['Kitchen Stock']]],
      ['acc', 'Access', 'ADMIN', [['Users / Roles']]]
    ];
    const mapItems = (items) => items.map(([lab, key, file, b]) => {
      const on = !!key && key === active;
      return {
        c, label: lab, link: !!file, nolink: !file,
        href: file ? file + sfx + '.dc.html' : '',

        current: on ? 'page' : 'false', hasBadge: !!b, badge: String(b || '')
      };
    });
    const groups = G.map(([k, label, section, items]) => {
      const isOpen = !!st.open[k];
      const hasActive = items.some((i) => i[1] === active);
      const total = items.reduce((n, i) => n + (i[3] || 0), 0);
      return {
        c, label, section, sectionStart: !!section, open: isOpen, closed: !isOpen,
        hc: hasActive ? c.text : c.text2, hw: hasActive ? '700' : '600',
        badge: !isOpen && total > 0, badgeText: String(total),
        isOrg: k === 'org', isMenu: k === 'menu', isMap: k === 'map', isInv: k === 'inv', isKit: k === 'kit', isAcc: k === 'acc',
        toggle: () => this.setState({ open: Object.assign({}, st.open, { [k]: !isOpen }) }),

    const railDef = [['dash', 'Dashboard', [['Dashboard', 'dashboard', 'Dashboard']]], 'div'].concat(
      G.slice(0, 3).map((g) => [g[0], g[1], g[3]]), ['div'], G.slice(3, 5).map((g) => [g[0], g[1], g[3]]), ['div'], [[G[5][0], G[5][1], G[5][3]]]);

    const tops = {};
    const rail = railDef.map((r) => {
      if (r === 'div') { y += 17; return { c, isDivider: true, isItem: false }; }
      const [k, label, items] = r;
      tops[k] = y; y += 48;
      const hasActive = items.some((i) => i[1] === active);
      const total = items.reduce((n, i) => n + (i[3] || 0), 0);
      const flyOpen = st.fly === k;
      return {
        c, isDivider: false, isItem: true, label,
        aria: label + (total ? ', ' + total + ' pending' : '') + (hasActive ? ', current section' : ''),
        popup: 'menu', flyOpen, current: hasActive ? 'true' : 'false',
        bg: hasActive ? c.primarySoft : flyOpen ? c.subtle : 'transparent',
        fg: hasActive ? c.link : c.text3,
        hasBadge: total > 0, badge: String(total),
        isDash: k === 'dash', isOrg: k === 'org', isMenu: k === 'menu', isMap: k === 'map', isInv: k === 'inv', isKit: k === 'kit', isAcc: k === 'acc',
        open: () => this.setState({ fly: k })
      };
    });
    const fr = railDef.find((r) => r !== 'div' && r[0] === st.fly);
    const flyTotal = fr ? fr[2].reduce((n, i) => n + (i[3] || 0), 0) : 0;
    const fly = fr ? { label: fr[1], labelUpper: fr[1].toUpperCase(), items: mapItems(fr[2]), top: (tops[fr[0]] - 6) + 'px', hasTotal: flyTotal > 0, total: flyTotal } : { label: '', labelUpper: '', items: [], top: '0px', hasTotal: false, total: 0 };
    const dOn = active === 'dashboard';
    return {
      c, groups, rail, fly, hasFly: !!fr,
      expanded: !st.collapsed, collapsed: st.collapsed,
      width: st.collapsed ? '72px' : '248px',
      toggle: () => this.setState({ collapsed: !st.collapsed, fly: '' }),
      closeFly: () => { if (st.fly) this.setState({ fly: '' }); },
      dashHref: 'Dashboard' + sfx + '.dc.html',
      dashBg: dOn ? c.primarySoft : 'transparent',
      dashFg: dOn ? c.link : c.text2,
      dashW: dOn ? '700' : '600',
      dashCur: dOn ? 'page' : 'false',
      paletteHref: 'Palette' + sfx + '.dc.html'
    };
  }
}
</script>
