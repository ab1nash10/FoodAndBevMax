<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AAHAR – Top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="min-height: 64px; box-sizing: border-box; display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; padding: 12px 24px; background: {{c.surface}}; border-bottom: 1px solid {{c.border}}; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: {{c.text}}">
<nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 6px; font-size: 13px; flex-shrink: 0">
<span style="color: {{c.muted}}; font-weight: 500">{{section}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{c.muted}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg>
<span style="font-weight: 700">{{page}}</span>
</nav>
<a href="{{paletteHref}}" style="flex: 1 1 260px; max-width: 460px; margin: 0 auto; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 8px 0 12px; border: 1px solid {{c.border}}; border-radius: 10px; background: {{c.subtle}}; color: {{c.muted}}; text-decoration: none; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="flex-grow: 1">Search transfers, items, GRNs…</span>
<kbd style="font-family: inherit; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 6px; border: 1px solid {{c.border}}; background: {{c.kbd}}; color: {{c.text3}}">Ctrl K</kbd>
</a>
<div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<button style="height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{c.tealText}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>All locations<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<a href="{{newHref}}" style="height: 40px; padding: 0 14px; border-radius: 10px; background: #0B57A4; color: #FFFFFF; display: flex; align-items: center; gap: 8px; text-decoration: none; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New transfer</a>
<button aria-label="Notifications, 3 unread" style="position: relative; width: 40px; height: 40px; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text2}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: -5px; right: -5px; min-width: 18px; height: 18px; box-sizing: border-box; padding: 0 5px; border-radius: 999px; background: #C0264B; color: #FFFFFF; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid {{c.surface}}">3</span></button>
<a href="{{otherHref}}" aria-label="{{themeLabel}}" style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 10px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text2}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{isDark}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></sc-if>
<sc-if value="{{isLight}}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path></svg></sc-if>
</a>
<button aria-label="Account menu: Super Admin" style="height: 40px; padding: 0 10px 0 4px; border-radius: 20px; border: 1px solid {{c.border}}; background: {{c.surface}}; color: {{c.text}}; display: flex; align-items: center; gap: 8px; font-family: inherit; cursor: pointer"><span style="width: 32px; height: 32px; border-radius: 50%; background: {{c.primarySoft}}; color: {{c.link}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">SA</span><span style="font-size: 13px; font-weight: 700">Super Admin</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"section":{"editor":null,"default":"Overview"},"page":{"editor":null,"default":"Dashboard"},"file":{"editor":null,"default":"Dashboard"},"$preview":{"width":1192,"height":64}}'>
class Component extends DCLogic {
  pal(t) {
    return t === 'dark'
      ? { surface: '#0E1525', subtle: '#161F2C', border: '#1F2A3D', text: '#F8FAFC', text2: '#CBD5E1', text3: '#94A3B8', muted: '#94A3B8', link: '#499EF4', primarySoft: '#082F49', tealText: '#5EEAD4', kbd: '#161F2C' }
      : { surface: '#FFFFFF', subtle: '#F8FAFC', border: '#E3E8EF', text: '#0F172A', text2: '#334155', text3: '#475569', muted: '#5B6577', link: '#0B57A4', primarySoft: '#E8F0FA', tealText: '#0F6B55', kbd: '#FFFFFF' };
  }
  renderVals() {
    const dark = this.props.theme === 'dark';
    const sfx = dark ? '-dark' : '';
    const file = this.props.file || 'Dashboard';
    return {
      c: this.pal(dark ? 'dark' : 'light'),
      section: this.props.section || 'Overview',
      page: this.props.page || 'Dashboard',
      isDark: dark,
      isLight: !dark,
      themeLabel: dark ? 'Switch to light theme' : 'Switch to dark theme',
      otherHref: dark ? file + '.dc.html' : file + '-dark.dc.html',
      paletteHref: 'Palette' + sfx + '.dc.html',
      newHref: 'NewTransfer' + sfx + '.dc.html'
    };
  }
}
</script>
</body>
</html>
