packages:
  - 'frontend/apps/*'
  - 'frontend/packages/*'
  - 'backend/services/*'
  - 'backend/packages/*'

overrides:
  body-parser@2: ^2.4.0
  fast-uri@3: ^3.1.9
  js-yaml@4: ^4.3.2
  mysql2@3: ^3.23.1
  multer@2: ^2.5.0
  qs@6: ^6.16.1
  # @prisma/config pins these; drop both once prisma ships effect >=3.22.1 (GHSA-7589-6fvf-x4pw).
  deepmerge-ts@7: ^8.0.2
  effect@3: ^3.22.2

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  sharp: true
