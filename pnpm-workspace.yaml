packages:
  - 'frontend/apps/*'
  - 'frontend/packages/*'
  - 'backend/services/*'
  - 'backend/packages/*'

overrides:
  body-parser@2: ^2.4.0
  fast-uri@3: ^3.1.9
  js-yaml@4: ^4.3.2
  mysql2@3: ^3.23.1
  multer@2: ^2.5.0
  qs@6: ^6.16.1

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  prisma: true
  sharp: true
