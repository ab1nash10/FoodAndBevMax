{{- /*
One Deployment and Service per backend service. A single "backend" deployment would run
only whichever service its image was built for, leaving the other two APIs absent -
auth-service in particular is what serves sign-in.
*/ -}}
{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fandb
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: {{ .replicas | default 1 }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .name }}
  strategy:
    type: {{ $.Values.strategy.type }}
    rollingUpdate:
      maxSurge: {{ $.Values.strategy.maxSurge }}
      maxUnavailable: {{ $.Values.strategy.maxUnavailable }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .name }}
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: fandb
    spec:
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      securityContext:
{{ toYaml $.Values.securityContext.pod | indent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name }}
      containers:
        - name: {{ .name }}
          image: "{{ $.Values.image.registry }}/{{ $.Values.image.repository }}:{{ .tagPrefix }}-{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .port }}
          env:
            - name: PORT
              value: {{ .port | quote }}
          # DATABASE_URL and both JWT secrets come from the Secret; BASE_PATH and
          # CORS_ORIGINS from the ConfigMap. Both objects must exist in this namespace - a
          # Secret cannot be read across namespaces - or the pod exits with
          # "Invalid service environment configuration".
          envFrom:
            - configMapRef:
                name: {{ $.Values.config.configMapName }}
            - secretRef:
                name: {{ $.Values.config.secretName }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            failureThreshold: {{ $.Values.livenessProbe.failureThreshold }}
          readinessProbe:
            httpGet:
              # The service serves under basePath, because an ALB cannot strip a prefix.
              path: {{ printf "%s/api/v1/health" (trimSuffix "/" $.Values.basePath) }}
              port: http
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            failureThreshold: {{ $.Values.readinessProbe.failureThreshold }}
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: {{ $.Values.startupProbe.periodSeconds }}
            failureThreshold: {{ $.Values.startupProbe.failureThreshold }}
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          securityContext:
{{ toYaml $.Values.securityContext.container | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: fandb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
