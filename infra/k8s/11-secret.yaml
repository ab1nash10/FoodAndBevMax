# TEMPLATE ONLY - do not put real values in this file and do not commit real values.
#
# Every value below is a placeholder. This manifest exists so the shape of the Secret is
# reviewable in version control; the actual values must come from AWS Secrets Manager.
#
# Preferred approach on EKS (nothing secret ever reaches the repository or the cluster manifest):
#
#   1. Store the values in AWS Secrets Manager under, for example, "aahar/production".
#   2. Install the External Secrets Operator and use the ExternalSecret at the bottom of this
#      file instead of the Secret above it. It pulls from Secrets Manager and creates the
#      Secret in-cluster, with IRSA providing the AWS credentials.
#
# If you must apply the plain Secret for a first bring-up, create it imperatively so the
# values never touch a file:
#
#   kubectl -n aahar create secret generic aahar-secrets \
#     --from-literal=DATABASE_URL='postgresql://USER:PASSWORD@HOST:5432/aahar?schema=public&connection_limit=10' \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -base64 48)"
#
# Both JWT secrets are validated at a minimum of 32 characters; the services refuse to start
# otherwise. Use different values for the two, and rotate them independently.
apiVersion: v1
kind: Secret
metadata:
  name: aahar-secrets
  namespace: aahar
  labels:
    app.kubernetes.io/part-of: aahar
type: Opaque
stringData:
  # connection_limit is set deliberately: three services each open their own pool against
  # the same database, and Prisma otherwise defaults to (cpus * 2 + 1) per service.
  DATABASE_URL: 'REPLACE_ME_postgresql://user:password@aahar-db.REGION.rds.amazonaws.com:5432/aahar?schema=public&connection_limit=10'
  # Redis is commented out in the services for now, so nothing reads this.
  # REDIS_URL: 'REPLACE_ME_redis://aahar-cache.REGION.cache.amazonaws.com:6379'
  JWT_ACCESS_SECRET: 'REPLACE_ME_minimum_32_characters_long_value'
  JWT_REFRESH_SECRET: 'REPLACE_ME_different_minimum_32_characters_value'

  # Optional, read only by the one-time seed Job. If both are present the seeded Super
  # Admin is given this password immediately; if absent the account is created without one
  # and you set it later with `pnpm admin:password`.
  #
  # Keep this per-environment and out of the repository. A password that is identical on
  # every deployment is the vulnerability this project already shipped once.
  ADMIN_EMAIL: 'aahar@admin.local'
  ADMIN_PASSWORD: 'REPLACE_ME_at_least_8_chars_with_a_letter_and_a_digit'
---
# Recommended alternative to the Secret above. Delete the Secret and apply this once the
# External Secrets Operator is installed and a SecretStore named aws-secrets-manager exists.
#
