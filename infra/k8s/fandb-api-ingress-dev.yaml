# Routes the API to the backend for the shared dev-cluster deployment (the `fandb` /
# `fandb-api` Helm releases from the platform Jenkins, namespace `dev`).
#
# That deployment's only ingress sends /fandb to the frontend, so every browser call to
# /fandb/api/v1/* landed on the portal and 404'd. This adds the one missing rule. A single
# rule is enough because the backend image is built with SERVICE=all and routes internally
# (backend/all-services.mjs).
#
#   kubectl apply -f infra/k8s/fandb-api-ingress-dev.yaml
#
# The name sorts before fandb-ext-ing so the AWS LB controller orders this rule ahead of
# the frontend's /fandb catch-all within the shared dev-external group.
#
# DELETE THIS INGRESS before deploying via the Helm chart (infra/helm/fandb): the chart
# creates its own fandb-api ingress for the same paths, and two owners of one path in the
# same ALB group conflict.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fandb-api-ext-ing
  namespace: dev
  labels:
    app.kubernetes.io/name: fandb-backend
    app.kubernetes.io/part-of: fandb
  annotations:
    alb.ingress.kubernetes.io/group.name: dev-external
    alb.ingress.kubernetes.io/healthcheck-path: /fandb/api/v1/health
    alb.ingress.kubernetes.io/target-type: ip
    # HTTPS only: sign-in codes, passwords and tokens never cross the internet in clear.
    # Plain HTTP for /fandb gets a 301 from fandb-https-redirect-dev.yaml instead. Same
    # certificate as the platform's fandb-ext-ing (devops repo, dev/fandb/fandb/values.yaml).
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:013929206983:certificate/8827a332-70f1-4127-89cc-286136ae9e74
spec:
  ingressClassName: alb-dev
  rules:
    - http:
        paths:
          - path: /fandb/api/v1
            pathType: Prefix
            backend:
              service:
                name: fandb-backend-service
                port:
                  number: 80
